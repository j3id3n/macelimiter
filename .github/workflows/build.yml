name: Build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -f plugin/pom.xml clean package
      - run: test -s plugin/target/macelimiter.jar
      - uses: actions/upload-artifact@v4
        with:
          name: macelimiter
          path: plugin/target/macelimiter.jar
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" plugin/target/macelimiter.jar --title "$GITHUB_REF_NAME" --generate-notes
