name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build macelimiter.jar
        run: mvn -B -f plugin/pom.xml clean package

      - name: Build console.jar
        run: |
          mkdir -p client/out
          javac --release 25 -d client/out client/ConsoleClient.java
          jar --create --file console.jar --main-class ConsoleClient -C client/out .

      - name: Upload macelimiter.jar
        uses: actions/upload-artifact@v4
        with:
          name: macelimiter
          path: plugin/target/macelimiter.jar

      - name: Upload console.jar
        uses: actions/upload-artifact@v4
        with:
          name: console
          path: console.jar
