<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaceLimiter Console</title><style>body{margin:0;background:#090b10;color:#e8ecf1;font:14px system-ui}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:18px;background:#0c1016;border-right:1px solid #252c36}.main{padding:20px}.server,.card{background:#111722;border:1px solid #28313d;border-radius:12px;padding:12px}.server{width:100%;color:white;text-align:left;margin-top:8px;cursor:pointer}.active{border-color:#7186ff}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#47d17a;margin-right:8px}.muted{color:#8b96a5;font-size:12px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.console{height:330px;background:#05070a;border-radius:8px;padding:10px;overflow:auto;font:12px monospace;white-space:pre-wrap}.token,.cmd{display:flex;gap:8px;margin-top:10px}.token input,.cmd input{flex:1;background:#090d13;color:white;border:1px solid #303a48;border-radius:8px;padding:10px}.btn{background:#667cff;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#151c28;padding:10px;border-radius:8px}.num{font-size:22px;font-weight:800}.loc{display:grid;grid-template-columns:80px 1fr 180px;gap:8px;padding:8px 0;border-bottom:1px solid #222b36;font-size:12px}.coord{font:12px monospace;color:#8fc7ff}.hidden{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><h2>MaceLimiter</h2><div class="muted">Connected servers</div><div id="servers"></div><p class="muted">Discovery is automatic. Select a server and authenticate with its access token.</p></aside><main class="main"><div id="empty" class="card">Select a server.</div><div id="panel" class="hidden"><div class="card"><h2 id="name"></h2><div id="meta" class="muted"></div><div class="token"><input id="token" type="password" placeholder="Server access token"><button class="btn" id="connect">Connect</button></div></div><div class="grid"><section class="card"><b>Live Console</b><div id="console" class="console"></div><div class="cmd"><input id="command" placeholder="Minecraft console command"><button class="btn" id="send">Run</button></div></section><section class="card"><b>Mace Tracking</b><div class="stats"><div class="stat">Total<div id="count" class="num">—</div></div><div class="stat">Storage<div id="storage" class="num">—</div></div><div class="stat">Ground<div id="ground" class="num">—</div></div></div><h3>Locations</h3><div id="locations"></div></section></div></div></main></div><script>var D='https://ntfy.sh/macelimiter-discovery-v2',S=new Map(),sel=null,es=null,authed=false,sess='';function $(x){return document.getElementById(x)}function b(s){try{var x=s.replace(/-/g,'+').replace(/_/g,'/');x+='='.repeat((4-x.length%4)%4);return decodeURIComponent(escape(atob(x)))}catch(e){return''}}function pub(t,m){return fetch(t,{method:'POST',body:m})}function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function render(){var q=$('servers');q.innerHTML='';S.forEach(function(s){var x=document.createElement('button');x.className='server '+(sel&&sel.id===s.id?'active':'');x.innerHTML='<span class="dot"></span><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.version)+'</div>';x.onclick=function(){select(s)};q.appendChild(x)})}function select(s){sel=s;$('empty').className='hidden';$('panel').className='';$('name').textContent=s.name;$('meta').textContent='MaceLimiter '+s.version+' · '+s.id;$('token').value=localStorage.getItem('ml-'+s.id)||'';$('console').textContent='';if(es)es.close();authed=false;render();if($('token').value)connect()}async function connect(){var t=$('token').value.trim();if(!t)return;localStorage.setItem('ml-'+sel.id,t);sess=crypto.randomUUID();authed=false;if(es)es.close();es=new EventSource(sel.topic+'/sse');es.onmessage=function(e){try{var m=JSON.parse(e.data);if(m.event==='message')handle(m.message)}catch(z){}};await new Promise(function(r){setTimeout(r,200)});await pub(sel.topic,'AUTH|'+sess+'|'+t)}function log(x){var c=$('console');c.textContent+=(c.textContent?'\n':'')+x;c.scrollTop=c.scrollHeight}function handle(m){if(m==='AUTHOK|'+sess){authed=true;pub(sel.topic,'GETSTATE|'+sess);return}if(!authed)return;if(m.indexOf('LOG|')===0){log(m.slice(4));return}if(m.indexOf('COUNT|')===0){$('count').textContent=m.split('|')[2]||'0';return}if(m.indexOf('MACE|')===0)renderLoc(b(m.split('|').slice(2).join('|')))}function renderLoc(data){var a=data.split(';').filter(Boolean).map(function(r){var p=r.split('~');return{k:p[1],o:p[2],w:p[3],x:p[4],y:p[5],z:p[6],p:p.slice(7).join('~')}}),st=a.filter(function(r){return r.k==='STORAGE'}),gr=a.filter(function(r){return r.k==='GROUND'});$('storage').textContent=st.length;$('ground').textContent=gr.length;$('locations').innerHTML=a.map(function(r){return '<div class="loc"><span>'+esc(r.k)+'</span><span><b>'+esc(r.o)+'</b><div class="muted">'+esc(r.p)+'</div></span><span class="coord">'+esc(r.w)+': '+r.x+', '+r.y+', '+r.z+'</span></div>'}).join('')||'<div class="muted">No maces detected.</div>'}$('connect').onclick=connect;$('send').onclick=function(){var c=$('command').value.trim();if(authed&&c){pub(sel.topic,'CMD|'+sess+'|'+c);$('command').value=''}};new EventSource(D+'/sse').onmessage=function(e){try{var m=JSON.parse(e.data);if(m.event!=='message')return;var p=m.message.split('|');if(p[0]==='DISCOVER'){S.set(p[1],{id:p[1],name:b(p[2]),version:p[3],topic:b(p[4]),status:p[5]});render()}}catch(z){}};</script></body></html>
