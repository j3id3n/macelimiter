name: MaceLimiter
main: com.example.macelimiter.MaceLimiterPlugin
version: '2.0.0'
api-version: '26.2'
description: Global Heavy Mace limiter with a built-in Discord bot and /maces command.
authors: [MaceLimiter]
commands:
  maces:
    description: Show the current global mace count
    usage: /maces
    permission: macelimiter.maces
permissions:
  macelimiter.maces:
    description: Allows players to view the global mace count
    default: true
